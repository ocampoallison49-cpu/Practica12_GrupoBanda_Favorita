            <p>
                Banda MS de Sergio Lizárraga, conocida artísticamente como Banda MS, es una agrupación de música regional mexicana originaria de Mazatlán, Sinaloa, México.<br
                Fue fundada en 2003 por Sergio Lizárraga y se ha consolidado como una de las bandas más representativas y exitosas del género banda en el siglo XXI.<br>
                A lo largo de su trayectoria, la agrupación ha posicionado múltiples sencillos en las listas de popularidad de México y Estados Unidos, destacando temas <br
                como “El color de tus ojos”, “Mi razón de ser”, “Háblame de ti”, “Me vas a extrañar”, “Hermosa experiencia” y “Mi mayor anhelo”. <br
            </p>
    
            <p>
                Su propuesta musical combina la tradición de la música de banda sinaloense con elementos contemporáneos de la música popular mexicana.<br
                Banda MS ha realizado giras internacionales por México, Estados Unidos, Centroamérica y Sudamérica, además de presentarse en muchos de los recintos más importantes.
                Ha obtenido múltiples certificaciones de oro, platino y diamante por ventas y reproducciones, así como reconocimientos otorgados por diferentes instituciones de la industria musical.<br
            </p>
